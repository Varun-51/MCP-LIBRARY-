name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    env:
      TK_TOKENIZER_DIR: ${{ github.workspace }}/.tokenizers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Restore tokenizer vocabularies
        id: vocab
        uses: actions/cache@v4
        with:
          path: .tokenizers
          key: tokenizers-${{ hashFiles('mcp-tokenizer/src/main/java/**/TkEncoding.java') }}

      - name: Build server jars
        run: mvn -B -ntp package -DskipTests

      - name: Download and verify tokenizer vocabularies
        if: steps.vocab.outputs.cache-hit != 'true'
        run: java -jar mcp-tokenizer/target/mcp-tokenizer-*-all.jar download

      - name: Test
        run: mvn -B -ntp verify

      - name: Smoke test stdio servers
        run: |
          for tkJar in */target/mcp-*-all.jar; do
            tkResponse=$( (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'; sleep 3) | timeout 30 java -jar "$tkJar" 2>/dev/null | head -n 1)
            echo "$tkJar -> $tkResponse"
            echo "$tkResponse" | grep -q '"serverInfo"'
          done
